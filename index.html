<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standard Calculator</title>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body class="light">


  <!-- Theme Toggle -->
  <button class="theme-toggle" id="theme-btn" type="button">
    🌙 Dark Mode
  </button>

  <!-- Calculator -->
  <main class="calculator">

    <!-- Display -->
    <section class="display-container" aria-live="polite">

      <div class="display-top">
        <div class="previous-operand" id="previous-operand"></div>

        <!-- History Icon -->
        <button
          id="history-btn"
          class="history-btn"
          type="button"
          aria-label="Show calculation history"
          title="Calculation History">
          <i data-lucide="history"></i>
        </button>
      </div>

      <div class="current-operand" id="current-operand">0</div>

    </section>

    <!-- History Container -->
    <div class="history-container" id="history-container">

      <div class="history-header">
        <h3>Calculation History</h3>

        <button id="clear-history" type="button">
          Clear
        </button>
      </div>

      <ul id="history-list">
        <li class="empty-history">No calculations yet</li>
      </ul>

    </div>

    <!-- Keypad -->
    <section class="keypad">

      <!-- Row 1 -->
      <button class="action-btn" >AC</button>
      <button class="action-btn" >⌫</button>
      <button class="action-btn" >%</button>
      <button class="operator-btn" >÷</button>

      <!-- Row 2 -->
      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator-btn" >×</button>

      <!-- Row 3 -->
      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator-btn" >−</button>

      <!-- Row 4 -->
      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="operator-btn" >+</button>

      <!-- Row 5 -->
      <button data-number="0">0</button>
      <button data-number="00">00</button>
      <button data-number=".">.</button>
      <button class="equals-btn">=</button>

    </section>

  </main>

  <!-- JavaScript -->
  <script src="script.js"></script>

  <!-- Render Lucide Icons -->
  <script>
    lucide.createIcons();
  </script>

</body>
</html>
